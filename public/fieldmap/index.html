  .sf-stats .filled { color: #4ade80; }

  th { text-align: left; padding: 8px 12px; color: #7a8088; font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #23252b; }
  td { padding: 8px 12px; border-bottom: 1px solid #1a1b20; }

function fmt(n) {
  if (n == null) return null;
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(0) + 'K';
  return '$' + n.toFixed(0);
}

function renderCards() {
  const s = DATA.summary;
  const budgetPct = Math.round(100 * s.with_budget / s.active_orgs);
  const grantPct = Math.round(100 * s.orgs_with_grants / s.active_orgs);
  document.getElementById('cards').innerHTML = `
    <div class="card"><div class="value">${fmt(s.total_granted)}</div><div class="label">Grants tracked</div></div>
    <div class="card"><div class="value">${fmt(s.total_budgets)}</div><div class="label">Budgets tracked</div></div>
    <div class="card"><div class="value">${s.active_orgs}</div><div class="label">Active orgs</div></div>
    <div class="card"><div class="value">${s.total_ftes.toLocaleString()}</div><div class="label">Total FTEs</div></div>
    <div class="card"><div class="value">${s.grant_count}</div><div class="label">Grant records</div></div>
    <div class="card ${budgetPct > 50 ? 'ok' : 'gap'}"><div class="value">${budgetPct}%</div><div class="label">Budget coverage</div></div>
    <div class="card ${grantPct > 50 ? 'ok' : 'gap'}"><div class="value">${grantPct}%</div><div class="label">Grant coverage</div></div>
  `;
}

function renderSubfields() {
  const maxFtes = Math.max(...DATA.subfields.map(s => s.total_ftes || 0));
  const el = document.getElementById('subfield-bars');
  el.innerHTML = DATA.subfields.map(s => {
    const pctFilled = s.with_budget / s.org_count;
    const pctMissing = 1 - pctFilled;
    const barWidth = ((s.total_ftes || 0) / maxFtes * 100).toFixed(1);
    const budgetStr = s.total_budget ? fmt(s.total_budget) : 'no data';
    const isSelected = selectedSubfield === s.subfield;
    return `
      <div class="subfield-row ${isSelected ? 'selected' : ''}" data-subfield="${s.subfield}" onclick="selectSubfield('${s.subfield}')">
        <div class="sf-name">${s.subfield}</div>
        <div class="sf-bar-wrap">
          <div class="sf-bar-stack" style="width: ${barWidth}%">
            <div class="sf-bar has-budget" style="width: ${pctFilled * 100}%"></div>
            <div class="sf-bar no-budget" style="width: ${pctMissing * 100}%"></div>
          </div>
        </div>
        <div class="sf-stats">
          <span>${s.org_count} orgs</span>
          <span>${s.total_ftes || 0} FTEs</span>
          <span class="${s.missing_budget > 0 ? 'missing' : 'filled'}">${s.missing_budget} missing</span>
          <span>${budgetStr}</span>
        </div>
      </div>
    `;
  }).join('');
}

function selectSubfield(name) {
  selectedSubfield = selectedSubfield === name ? null : name;
  renderSubfields();
  const detail = document.getElementById('subfield-detail');
  if (!selectedSubfield) { detail.innerHTML = ''; return; }
  const orgs = DATA.orgs.filter(o => o.subfield === name).sort((a, b) => (b.ftes || 0) - (a.ftes || 0));
  detail.innerHTML = `
    <div class="section-title">${name} — ${orgs.length} orgs</div>
    ${orgTable(orgs)}
  `;
}

function orgTable(orgs) {
  return `<table>
    <tr><th>Organization</th><th>FTEs</th><th>Budget</th><th>Grants</th><th>Category</th></tr>
    ${orgs.map(o => `<tr>
      <td>${o.url ? '<a href="' + o.url + '" target="_blank">' + o.name + '</a>' : o.name}</td>
      <td>${o.ftes || '<span class="muted">—</span>'}</td>
      <td class="${o.annual_budget_usd ? 'ok-cell' : 'gap-cell'}">${o.annual_budget_usd ? fmt(o.annual_budget_usd) : 'MISSING'}</td>
      <td class="${o.grant_count > 0 ? 'ok-cell' : 'gap-cell'}">${o.grant_count > 0 ? o.grant_count + ' (' + fmt(o.total_granted) + ')' : 'NONE'}</td>
      <td class="muted">${o.category || ''}</td>
    </tr>`).join('')}
  </table>`;
}

function renderOrgs() {
  applyOrgFilters();
}

function applyOrgFilters() {
  const search = (document.getElementById('org-search')?.value || '').toLowerCase();
  const sfFilter = document.getElementById('org-filter-subfield')?.value || '';
  const gapFilter = document.getElementById('org-filter-gap')?.value || '';

  let orgs = DATA.orgs;
  if (search) orgs = orgs.filter(o => o.name.toLowerCase().includes(search));
  if (sfFilter) orgs = orgs.filter(o => o.subfield === sfFilter);
  if (gapFilter === 'missing-budget') orgs = orgs.filter(o => !o.annual_budget_usd);
  if (gapFilter === 'missing-grants') orgs = orgs.filter(o => o.grant_count === 0);
  if (gapFilter === 'complete') orgs = orgs.filter(o => o.annual_budget_usd && o.grant_count > 0);

  document.getElementById('org-table').innerHTML = `
    <div style="font-size:12px;color:#7a8088;margin-bottom:8px">${orgs.length} orgs</div>
    ${orgTable(orgs)}
  `;
}

function populateFilters() {
  const sel = document.getElementById('org-filter-subfield');
  const subfields = [...new Set(DATA.orgs.map(o => o.subfield))].filter(Boolean).sort();
  subfields.forEach(sf => {

function squarify(items, x, y, w, h) {
  // Squarified treemap layout
  if (items.length === 0) return [];
  const total = items.reduce((s, d) => s + d.value, 0);
  if (total === 0) return [];

  const rects = [];
  let remaining = [...items];
  let cx = x, cy = y, cw = w, ch = h;

  while (remaining.length > 0) {
    const areaLeft = remaining.reduce((s, d) => s + d.value, 0);
    const isWide = cw >= ch;
    const side = isWide ? ch : cw;
    if (side <= 0 || areaLeft <= 0) break;

    // Find the best row
    let row = [remaining[0]];
    let rowArea = remaining[0].value;
    let bestRatio = worstRatio(row, rowArea, side, cw * ch * (areaLeft > 0 ? rowArea / areaLeft : 0), side);

    for (let i = 1; i < remaining.length; i++) {
      const testRow = [...row, remaining[i]];
      const testArea = rowArea + remaining[i].value;
      const testRatio = worstRatio(testRow, testArea, side, cw * ch * (areaLeft > 0 ? testArea / areaLeft : 0), side);
      if (testRatio < bestRatio) {
        row = testRow;
        rowArea = testArea;
        bestRatio = testRatio;
      } else {
        break;
      }
    }

    // Layout this row
    const rowFrac = areaLeft > 0 ? rowArea / areaLeft : 0;
    const rowSize = isWide ? cw * rowFrac : ch * rowFrac;

    let offset = 0;
    for (const item of row) {
      const itemFrac = rowArea > 0 ? item.value / rowArea : 0;
      const itemSize = side * itemFrac;
      if (isWide) {
        rects.push({ ...item, x: cx, y: cy + offset, w: rowSize, h: itemSize });
      } else {
        rects.push({ ...item, x: cx + offset, y: cy, w: itemSize, h: rowSize });
      }
      offset += itemSize;
    }

    if (isWide) { cx += rowSize; cw -= rowSize; }
    else { cy += rowSize; ch -= rowSize; }

    remaining = remaining.slice(row.length);
  }
  return rects;
}

function worstRatio(row, rowArea, side, totalArea, fullSide) {
  if (rowArea === 0) return Infinity;
  const rowLen = totalArea > 0 ? totalArea / side : 0;
  if (rowLen === 0) return Infinity;
  let worst = 0;
  for (const item of row) {
    const frac = item.value / rowArea;
    const itemLen = side * frac;
    if (itemLen === 0 || rowLen === 0) continue;
    const r = Math.max(itemLen / rowLen, rowLen / itemLen);
    if (r > worst) worst = r;
  }
  return worst;
}

function renderTreemap() {
  const container = document.getElementById('treemap');
  const W = container.offsetWidth;
  const H = container.offsetHeight || (W * 9 / 16);
  container.style.height = H + 'px';
  container.innerHTML = '';

  // Remove old tooltip
  document.querySelectorAll('.tm-tooltip').forEach(t => t.remove());

  // Group orgs by subfield, sorted by total FTEs desc
  const groups = {};
  for (const o of DATA.orgs) {
    const sf = o.subfield || 'Unknown';
    if (!groups[sf]) groups[sf] = { name: sf, orgs: [], totalFtes: 0 };
    groups[sf].orgs.push(o);
    groups[sf].totalFtes += (o.ftes || 0);
  }
  const groupList = Object.values(groups).sort((a, b) => b.totalFtes - a.totalFtes);

  // Layout groups as top-level treemap
  const groupItems = groupList.map(g => ({ value: g.totalFtes, data: g }));
  const groupRects = squarify(groupItems, 0, 0, W, H);

  // Tooltip element
  const tooltip = document.createElement('div');
  tooltip.className = 'tm-tooltip';
  tooltip.style.display = 'none';
  document.body.appendChild(tooltip);

  let selectedGroup = null;

  for (const gr of groupRects) {
    const g = gr.data;
    const colors = SUBFIELD_COLORS[g.name] || { bg: '#555', text: '#ccc' };
    const pad = 22; // space for group label

    // Group container
    const groupEl = document.createElement('div');
    groupEl.className = 'tm-group';
    groupEl.style.cssText = `left:${gr.x}px;top:${gr.y}px;width:${gr.w}px;height:${gr.h}px;`;

    // Group label
    const label = document.createElement('div');
    label.className = 'tm-group-label';
    label.textContent = `${g.name} (${g.totalFtes} FTEs)`;
    label.style.background = `linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%)`;
    groupEl.appendChild(label);

    // Layout org cells within group
    const orgItems = g.orgs
      .filter(o => (o.ftes || 0) > 0)
      .sort((a, b) => (b.ftes || 0) - (a.ftes || 0))
      .map(o => ({ value: o.ftes || 0, data: o }));

    const innerW = gr.w - 2;
    const innerH = gr.h - pad - 2;
    if (innerW > 0 && innerH > 0) {
      const cellRects = squarify(orgItems, 1, pad, innerW, innerH);

      for (const cr of cellRects) {
        const o = cr.data;
        const cell = document.createElement('div');
        cell.className = 'tm-cell';
        cell.style.cssText = `left:${cr.x}px;top:${cr.y}px;width:${cr.w}px;height:${cr.h}px;background:${colors.bg};`;

        // Only show text if box is big enough
        if (cr.w > 35 && cr.h > 20) {
          const nameEl = document.createElement('div');
          nameEl.className = 'tm-name';
          // Abbreviate long names for small boxes
          let displayName = o.name;
          if (cr.w < 80) {
            displayName = displayName.replace(/\(.*?\)/g, '').trim();
            if (displayName.length > 12) displayName = displayName.slice(0, 11) + '…';
          } else if (cr.w < 120 && displayName.length > 20) {
            displayName = displayName.slice(0, 19) + '…';
          }
          nameEl.textContent = displayName;
          cell.appendChild(nameEl);

          if (cr.h > 32 && cr.w > 45) {
            const ftesEl = document.createElement('div');
            ftesEl.className = 'tm-ftes';
            ftesEl.textContent = o.ftes + ' FTEs';
            cell.appendChild(ftesEl);
          }
        }

        // Tooltip
        cell.addEventListener('mouseenter', (e) => {
          tooltip.style.display = 'block';
          tooltip.innerHTML = `
            <div class="tt-name">${o.name}</div>
            <div class="tt-row"><span class="tt-label">Subfield</span><span class="tt-val">${o.subfield}</span></div>
            <div class="tt-row"><span class="tt-label">Category</span><span class="tt-val">${o.category || '—'}</span></div>
            <div class="tt-row"><span class="tt-label">FTEs</span><span class="tt-val">${o.ftes || '—'}</span></div>
            <div class="tt-row"><span class="tt-label">Founded</span><span class="tt-val">${o.founded_year || '—'}</span></div>
            <div class="tt-row"><span class="tt-label">Budget</span><span class="tt-val" style="color:${o.annual_budget_usd ? '#4ade80' : '#e85d5d'}">${o.annual_budget_usd ? fmt(o.annual_budget_usd) : 'MISSING'}</span></div>
            <div class="tt-row"><span class="tt-label">Grants</span><span class="tt-val" style="color:${o.grant_count > 0 ? '#4ade80' : '#e85d5d'}">${o.grant_count > 0 ? o.grant_count : 'NONE'}</span></div>
          `;
        });
        cell.addEventListener('mousemove', (e) => {
          tooltip.style.left = (e.clientX + 12) + 'px';
          tooltip.style.top = (e.clientY + 12) + 'px';
        });
        cell.addEventListener('mouseleave', () => {
          tooltip.style.display = 'none';
        });

        groupEl.appendChild(cell);
      }
    }

    // Click group to show detail table below
    groupEl.addEventListener('click', () => {
      if (selectedGroup === g.name) {
        selectedGroup = null;
        document.getElementById('treemap-detail').innerHTML = '';
        document.querySelectorAll('.tm-group').forEach(el => el.style.opacity = '1');
      } else {
        selectedGroup = g.name;
        document.querySelectorAll('.tm-group').forEach(el => el.style.opacity = '0.3');
        groupEl.style.opacity = '1';
        const orgs = DATA.orgs.filter(o => o.subfield === g.name).sort((a, b) => (b.ftes || 0) - (a.ftes || 0));
        document.getElementById('treemap-detail').innerHTML = `
          <div class="section-title">${g.name} — ${orgs.length} orgs, ${g.totalFtes} FTEs</div>
          ${orgTable(orgs)}
        `;
      }
    });

    container.appendChild(groupEl);
  }
}

        groupEl.style.opacity = '1';
        const funders = DATA.funders
          .filter(f => (f.funder_type || 'Unknown') === g.name)
          .sort((a, b) => (b.total_disbursed || 0) - (a.total_disbursed || 0));
        document.getElementById('funder-treemap-detail').innerHTML = `
          <div class="section-title">${g.name} — ${funders.length} funders, ${fmt(g.totalDisbursed)} disbursed</div>
          ${funderTable(funders)}
        `;
      }
    });

    container.appendChild(groupEl);
  }
}

function renderFunderSubfieldTreemap(funder, orgs) {
  const detail = document.getElementById('funder-treemap-detail');
  const total = orgs.reduce((sum, o) => sum + (o.total_granted || 0), 0);
  detail.innerHTML = `
    <div class="section-title">${funder.name} — recipient subfields</div>
    <div class="legend" style="margin-bottom:12px">
      <span>Box area = grants from ${funder.name}. Grouped by recipient subfield.</span>
    </div>
    <div class="treemap-container" id="funder-subfield-treemap"></div>
    <div id="funder-subfield-detail" class="org-table-wrap">
      <div class="section-title">${orgs.length} recipient orgs, ${fmt(total)} total</div>
      ${orgGrantTable(orgs)}
    </div>
  `;

  const container = document.getElementById('funder-subfield-treemap');
  const W = container.offsetWidth;
  const H = container.offsetHeight || (W * 9 / 16);
  container.style.height = H + 'px';
  container.innerHTML = '';

  document.querySelectorAll('.tm-tooltip').forEach(t => t.remove());

  const groups = {};
  for (const o of orgs) {
    const sf = o.subfield || 'Unknown';
    const granted = o.total_granted || 0;
    if (!groups[sf]) groups[sf] = { name: sf, orgs: [], totalGranted: 0 };
    groups[sf].orgs.push(o);
    groups[sf].totalGranted += granted;
  }
  const groupList = Object.values(groups)
    .filter(g => g.totalGranted > 0)
    .sort((a, b) => b.totalGranted - a.totalGranted);

  const groupItems = groupList.map(g => ({ value: g.totalGranted, data: g }));
  const groupRects = squarify(groupItems, 0, 0, W, H);

  const tooltip = document.createElement('div');
  tooltip.className = 'tm-tooltip';
  tooltip.style.display = 'none';
  document.body.appendChild(tooltip);

  let selectedGroup = null;

  for (const gr of groupRects) {
    const g = gr.data;
    const colors = SUBFIELD_COLORS[g.name] || { bg: '#555', text: '#ccc' };
    const pad = 22;

    const groupEl = document.createElement('div');
    groupEl.className = 'tm-group';
    groupEl.style.cssText = `left:${gr.x}px;top:${gr.y}px;width:${gr.w}px;height:${gr.h}px;`;

    const label = document.createElement('div');
    label.className = 'tm-group-label';
    label.textContent = `${g.name} (${fmt(g.totalGranted)})`;
    label.style.background = `linear-gradient(180deg, rgba(0,0,0,0.5) 0%, transparent 100%)`;
    groupEl.appendChild(label);

    const orgItems = g.orgs
      .filter(o => (o.total_granted || 0) > 0)
      .sort((a, b) => (b.total_granted || 0) - (a.total_granted || 0))
      .map(o => ({ value: o.total_granted || 0, data: o }));

    const innerW = gr.w - 2;
    const innerH = gr.h - pad - 2;
    if (innerW > 0 && innerH > 0) {
      const cellRects = squarify(orgItems, 1, pad, innerW, innerH);

      for (const cr of cellRects) {
        const o = cr.data;
        const cell = document.createElement('div');
        cell.className = 'tm-cell';
        cell.style.cssText = `left:${cr.x}px;top:${cr.y}px;width:${cr.w}px;height:${cr.h}px;background:${colors.bg};`;

        if (cr.w > 35 && cr.h > 20) {
          const nameEl = document.createElement('div');
          nameEl.className = 'tm-name';
          let displayName = o.name;
          if (cr.w < 80) {
            displayName = displayName.replace(/\(.*?\)/g, '').trim();
            if (displayName.length > 12) displayName = displayName.slice(0, 11) + '…';
          } else if (cr.w < 120 && displayName.length > 20) {
            displayName = displayName.slice(0, 19) + '…';
          }
          nameEl.textContent = displayName;
          cell.appendChild(nameEl);

          if (cr.h > 32 && cr.w > 45) {
            const amountEl = document.createElement('div');
            amountEl.className = 'tm-ftes';
            amountEl.textContent = fmt(o.total_granted);
            cell.appendChild(amountEl);
          }
        }

        cell.addEventListener('mouseenter', () => {
          tooltip.style.display = 'block';
          tooltip.innerHTML = `
            <div class="tt-name">${o.name}</div>
            <div class="tt-row"><span class="tt-label">Subfield</span><span class="tt-val">${o.subfield || '—'}</span></div>
            <div class="tt-row"><span class="tt-label">Grants from funder</span><span class="tt-val">${o.grant_count || 0}</span></div>
            <div class="tt-row"><span class="tt-label">Amount</span><span class="tt-val">${fmt(o.total_granted) || '—'}</span></div>
            <div class="tt-row"><span class="tt-label">FTEs</span><span class="tt-val">${o.ftes || '—'}</span></div>
            <div class="tt-row"><span class="tt-label">Scope</span><span class="tt-val">${o.scope_type || 'org'}</span></div>
          `;
        });
        cell.addEventListener('mousemove', (e) => {
          tooltip.style.left = (e.clientX + 12) + 'px';
          tooltip.style.top = (e.clientY + 12) + 'px';
        });
        cell.addEventListener('mouseleave', () => {
          tooltip.style.display = 'none';
        });

        groupEl.appendChild(cell);
      }
    }

    groupEl.addEventListener('click', () => {
      if (selectedGroup === g.name) {
        selectedGroup = null;
        document.getElementById('funder-subfield-detail').innerHTML = `
          <div class="section-title">${orgs.length} recipient orgs, ${fmt(total)} total</div>
          ${orgGrantTable(orgs)}
        `;
        document.querySelectorAll('#funder-subfield-treemap .tm-group').forEach(el => el.style.opacity = '1');
      } else {
        selectedGroup = g.name;
        document.querySelectorAll('#funder-subfield-treemap .tm-group').forEach(el => el.style.opacity = '0.3');
        groupEl.style.opacity = '1';
        const subfieldOrgs = g.orgs.sort((a, b) => (b.total_granted || 0) - (a.total_granted || 0));
        document.getElementById('funder-subfield-detail').innerHTML = `
          <div class="section-title">${funder.name} → ${g.name} — ${subfieldOrgs.length} orgs, ${fmt(g.totalGranted)} total</div>
          ${orgGrantTable(subfieldOrgs)}
        `;
      }
    });

    container.appendChild(groupEl);
  }
}

function orgGrantTable(orgs) {
  return `<table>
    <tr><th>Organization</th><th>Subfield</th><th>Amount</th><th>Grants</th><th>FTEs</th><th>Scope</th></tr>
    ${orgs.map(o => `<tr>
      <td>${o.url ? '<a href="' + o.url + '" target="_blank">' + o.name + '</a>' : o.name}</td>
      <td class="muted">${o.subfield || ''}</td>
      <td class="${o.total_granted ? 'ok-cell' : 'gap-cell'}">${o.total_granted ? fmt(o.total_granted) : 'no data'}</td>
      <td>${o.grant_count || 0}</td>
      <td>${o.ftes || '<span class="muted">—</span>'}</td>
      <td class="muted">${o.scope_type || 'org'}</td>
    </tr>`).join('')}
  </table>`;
}

// ── Sources tab ──

function srcQuality(o) {
  // Returns 0-1 score: 1 = all high, 0 = all untagged/none
  const total = o.grant_count;
  if (total === 0) return -1; // no grants
  return (o.src_high * 1.0 + o.src_medium * 0.6 + o.src_low * 0.3) / total;
}

function srcBar(o) {
  const total = o.grant_count;
  if (total === 0) return '<span class="muted">—</span>';
  const pH = (o.src_high / total * 100).toFixed(1);
  const pM = (o.src_medium / total * 100).toFixed(1);
  const pL = (o.src_low / total * 100).toFixed(1);
  const pN = (o.src_untagged / total * 100).toFixed(1);
  return `<div class="src-bar" title="${o.src_high} high, ${o.src_medium} med, ${o.src_low} low, ${o.src_untagged} untagged">
    <div class="seg seg-high" style="width:${pH}%"></div>
    <div class="seg seg-med" style="width:${pM}%"></div>
    <div class="seg seg-low" style="width:${pL}%"></div>
    <div class="seg seg-none" style="width:${pN}%"></div>
  </div>`;
}

function renderSrcAggregate() {
  const a = DATA.sourcing.aggregate;
  const types = DATA.sourcing.source_types;
  const pctHigh = Math.round(100 * a.high / a.total_sources);
  const pctTagged = Math.round(100 * (a.high + a.medium + a.low) / a.total_sources);
  document.getElementById('src-aggregate').innerHTML = `
    <div class="src-agg-row">
      <div class="src-agg-card"><div class="sa-value">${a.total_sources}</div><div class="sa-label">Total sources</div></div>
      <div class="src-agg-card"><div class="sa-value" style="color:#4ade80">${a.high}</div><div class="sa-label">High confidence</div></div>
      <div class="src-agg-card"><div class="sa-value" style="color:#f0c040">${a.medium}</div><div class="sa-label">Medium</div></div>
      <div class="src-agg-card"><div class="sa-value" style="color:#e85d5d">${a.low}</div><div class="sa-label">Low</div></div>
      <div class="src-agg-card"><div class="sa-value" style="color:#555960">${a.untagged}</div><div class="sa-label">Untagged</div></div>
      <div class="src-agg-card"><div class="sa-value">${pctTagged}%</div><div class="sa-label">Confidence tagged</div></div>
    </div>
    <div class="src-legend">
      <span><span class="src-legend-dot" style="background:#4ade80"></span> High (filing/grant page)</span>
      <span><span class="src-legend-dot" style="background:#f0c040"></span> Medium (annual report)</span>
      <span><span class="src-legend-dot" style="background:#e85d5d"></span> Low (estimate/inference)</span>
      <span><span class="src-legend-dot" style="background:#3a3d44"></span> Untagged</span>
    </div>
  `;
}

function renderSources() {
  renderSrcAggregate();
  applySrcFilters();
}

function ratioCell(ratio) {
  if (ratio == null) return '<span class="muted">—</span>';
  const pct = Math.round(ratio * 100);
  const capped = Math.min(pct, 100);
  const color = pct >= 80 ? '#4ade80' : pct >= 40 ? '#f0c040' : '#e85d5d';
  return `<div style="display:flex;align-items:center;gap:6px">
    <div style="width:50px;height:10px;background:#23252b;border-radius:3px;overflow:hidden">
      <div style="width:${capped}%;height:100%;background:${color};border-radius:3px"></div>
    </div>
    <span style="color:${color};font-size:12px;font-weight:600">${pct > 999 ? '>999' : pct}%</span>
  </div>`;
}

function applySrcFilters() {
  const search = (document.getElementById('src-search')?.value || '').toLowerCase();
  const quality = document.getElementById('src-filter-quality')?.value || '';
  const sort = document.getElementById('src-sort')?.value || 'usd-desc';

  // Build funding lookup by org id
  const fundingById = {};
  if (DATA.funding) DATA.funding.forEach(f => { fundingById[f.id] = f; });

  let orgs = DATA.sourcing.orgs;
  if (search) orgs = orgs.filter(o => o.name.toLowerCase().includes(search));
  if (quality === 'all-high') orgs = orgs.filter(o => o.grant_count > 0 && o.src_high === o.grant_count);
  if (quality === 'has-untagged') orgs = orgs.filter(o => o.src_untagged > 0);
  if (quality === 'no-grants') orgs = orgs.filter(o => o.grant_count === 0);
  if (quality === 'no-budget-src') orgs = orgs.filter(o => o.annual_budget_usd && !o.has_budget_source);

  if (sort === 'usd-desc') orgs = [...orgs].sort((a, b) => b.grant_usd - a.grant_usd);
  else if (sort === 'quality-asc') orgs = [...orgs].sort((a, b) => srcQuality(a) - srcQuality(b));
  else if (sort === 'grants-desc') orgs = [...orgs].sort((a, b) => b.grant_count - a.grant_count);

  const rows = orgs.map(o => {
    const fp = fundingById[o.id] || {};
    const budgetCell = o.annual_budget_usd
      ? `<span class="budget-src-dot ${o.has_budget_source ? 'yes' : 'no'}"></span> ${fmt(o.annual_budget_usd)}`
      : '<span class="muted">—</span>';
    return `<tr>
      <td>${o.name}</td>
      <td class="muted">${o.subfield || ''}</td>
      <td>${o.grant_count > 0 ? fmt(o.grant_usd) : '<span class="muted">—</span>'}</td>
      <td style="width:140px">${srcBar(o)}</td>
      <td>${budgetCell}</td>
    </tr>`;
  }).join('');

  document.getElementById('src-table').innerHTML = `
    <div style="font-size:12px;color:#7a8088;margin-bottom:8px">${orgs.length} orgs</div>
    <table>
      <tr>
        <th>Organization</th><th>Subfield</th><th>Grant $</th>
        <th>Source quality</th><th>Expenses</th>
      </tr>
      ${rows}
    </table>
  `;
}

function populateSrcFilters() {
  document.getElementById('src-search').addEventListener('input', applySrcFilters);
  document.getElementById('src-filter-quality').addEventListener('change', applySrcFilters);
  document.getElementById('src-sort').addEventListener('change', applySrcFilters);
}

// ── Data Gaps tab ──

const GAP_FIELDS = [
  { key: 'has_ftes', label: 'FTEs' },
  { key: 'has_budget', label: 'Budget' },
  { key: 'has_grants', label: 'Grants' },
  { key: 'has_url', label: 'URL' },
  { key: 'has_year', label: 'Founded' },
];

function gapCount(org) {
  return GAP_FIELDS.reduce((n, f) => n + (org[f.key] ? 0 : 1), 0);
}

function renderGaps() {
  applyGapFilters();
}

function renderGapSummary(orgs) {
  const total = orgs.length;
  if (total === 0) { document.getElementById('gap-summary').innerHTML = ''; return; }
  const el = document.getElementById('gap-summary');
  el.innerHTML = '<div class="gap-summary-bar">' + GAP_FIELDS.map(f => {
    const filled = orgs.filter(o => o[f.key]).length;
    const pct = Math.round(100 * filled / total);
    const cls = pct >= 70 ? 'high' : pct >= 40 ? 'mid' : 'low';
    const color = pct >= 70 ? '#4ade80' : pct >= 40 ? '#f0c040' : '#e85d5d';
    return `<div class="gap-field-card">
      <div class="field-name">${f.label}</div>
      <div class="field-pct ${cls}">${pct}%</div>
      <div class="field-bar"><div class="field-bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <div class="field-detail">${filled} / ${total} orgs</div>
    </div>`;
  }).join('') + '</div>';
}

function applyGapFilters() {
  const search = (document.getElementById('gap-search')?.value || '').toLowerCase();
  const sfFilter = document.getElementById('gap-filter-subfield')?.value || '';
  const fieldFilter = document.getElementById('gap-filter-field')?.value || '';
  const sort = document.getElementById('gap-sort')?.value || 'gaps-desc';

  let orgs = DATA.gaps;
  if (search) orgs = orgs.filter(o => o.name.toLowerCase().includes(search));
  if (sfFilter) orgs = orgs.filter(o => o.subfield === sfFilter);
  if (fieldFilter === 'missing-any') orgs = orgs.filter(o => gapCount(o) > 0);
  if (fieldFilter === 'missing-ftes') orgs = orgs.filter(o => !o.has_ftes);
  if (fieldFilter === 'missing-budget') orgs = orgs.filter(o => !o.has_budget);
  if (fieldFilter === 'missing-grants') orgs = orgs.filter(o => !o.has_grants);
  if (fieldFilter === 'missing-url') orgs = orgs.filter(o => !o.has_url);
  if (fieldFilter === 'complete') orgs = orgs.filter(o => gapCount(o) === 0);

  if (sort === 'gaps-desc') orgs = [...orgs].sort((a, b) => gapCount(b) - gapCount(a) || (b.ftes || 0) - (a.ftes || 0));
  else if (sort === 'ftes-desc') orgs = [...orgs].sort((a, b) => (b.ftes || 0) - (a.ftes || 0));
  else if (sort === 'name-asc') orgs = [...orgs].sort((a, b) => a.name.localeCompare(b.name));

  renderGapSummary(orgs);

  const rows = orgs.map(o => {
    const gaps = gapCount(o);
    const gapCls = gaps === 0 ? 'zero' : gaps <= 2 ? 'some' : 'many';
    const dots = GAP_FIELDS.map(f =>
      `<td class="gap-cell-center"><span class="gap-dot ${o[f.key] ? 'filled' : 'missing'}" title="${f.label}: ${o[f.key] ? 'yes' : 'MISSING'}"></span></td>`
    ).join('');
    return `<tr>
      <td>${o.name}</td>
      <td class="muted">${o.subfield || ''}</td>
      <td>${o.ftes || '<span class="muted">—</span>'}</td>
      ${dots}
      <td class="gap-cell-center"><span class="gap-count ${gapCls}">${gaps}</span></td>
    </tr>`;
  }).join('');

  document.getElementById('gap-table').innerHTML = `
    <div style="font-size:12px;color:#7a8088;margin-bottom:8px">${orgs.length} orgs</div>
    <table>
      <tr>
        <th>Organization</th><th>Subfield</th><th>FTEs</th>
        ${GAP_FIELDS.map(f => `<th style="text-align:center">${f.label}</th>`).join('')}
        <th style="text-align:center">Gaps</th>
      </tr>
      ${rows}
    </table>
  `;
}

function populateGapFilters() {
  const sel = document.getElementById('gap-filter-subfield');
  const subfields = [...new Set(DATA.gaps.map(o => o.subfield))].filter(Boolean).sort();
  subfields.forEach(sf => {
    const opt = document.createElement('option');
    opt.value = sf; opt.textContent = sf;
    sel.appendChild(opt);
  });
  document.getElementById('gap-search').addEventListener('input', applyGapFilters);
  document.getElementById('gap-filter-subfield').addEventListener('change', applyGapFilters);
  document.getElementById('gap-filter-field').addEventListener('change', applyGapFilters);
  document.getElementById('gap-sort').addEventListener('change', applyGapFilters);
}

// Resize handler
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (document.getElementById('tab-treemap').style.display !== 'none') renderTreemap();
    if (document.getElementById('tab-funders').style.display !== 'none') {
      renderFunderTreemap();
      if (selectedFunder && selectedFunderOrgs) renderFunderSubfieldTreemap(selectedFunder, selectedFunderOrgs);
    }
  }, 150);
});

// Tab switching
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
    tab.classList.add('active');
    document.getElementById('tab-' + tab.dataset.tab).style.display = '';
    if (tab.dataset.tab === 'treemap') renderTreemap();
    if (tab.dataset.tab === 'funders') renderFunderTreemap();
  });
});

load().then(() => renderTreemap());
</script>
