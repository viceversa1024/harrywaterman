name: Congress tracker sweep

# Scheduled sweep that keeps public/congress-oai-response/ current. Runs Claude Code in
# GitHub Actions (full network egress: WebFetch + WebSearch + Apify all work here),
# following data/congress-tracker/sweep-prompt.md. Replaces the retired claude.ai cloud
# routine, whose sandbox had no outbound network.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions):
#   ANTHROPIC_API_KEY  - Anthropic API key for Claude Code
#   APIFY_TOKEN        - Apify token for the X/tweet scrape
#
# Deploy is chained off this workflow via the `workflow_run` trigger in deploy.yml,
# because a commit pushed here with GITHUB_TOKEN does not itself trigger the Pages
# deploy (GitHub suppresses that to avoid loops).

on:
  schedule:
    - cron: "29 */4 * * *"   # every 4 hours (UTC) — matches the retired cloud routine
  workflow_dispatch:          # manual trigger for testing / on-demand runs

permissions:
  contents: write             # the sweep commits + pushes the updated page to main

concurrency:
  group: tracker-sweep
  cancel-in-progress: false   # never interrupt a run mid-commit

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0        # full history: build-changelog.mjs reads `git log`

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"    # for scripts/build-coverage.mjs + build-changelog.mjs (no deps)

      - name: Run tracker sweep
        uses: anthropics/claude-code-action@v1
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read data/congress-tracker/sweep-prompt.md and execute it exactly — it is
            your complete and only set of instructions. The Apify token is in the
            APIFY_TOKEN environment variable (never print or commit it). Do the sweep,
            update the page and regenerate the derived pages as described, and commit +
            push any changes to main yourself. If there is nothing new, make no commit
            and exit cleanly.
          claude_args: |
            --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch
            --model claude-sonnet-5
            --max-turns 80
